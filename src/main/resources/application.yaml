spring:
  application:
    name: CapstoneProject
  h2:
    console:
      enabled: true
      path: /h2-console  # (기본값이라 생략 가능하지만 명시적으로 적어주면 좋습니다)
  datasource:
    url: jdbc:h2:mem:capstone;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
fridge:
  expiry-disposal:
    # 매일 자정에 유통기한이 지난 보관 중 재료를 폐기 처리한다.
    cron: "0 0 0 * * *"
gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  timeout: ${GEMINI_TIMEOUT:30s}
food-data:
  import:
    enabled: ${FOOD_DATA_IMPORT_ENABLED:false}
    path: ${FOOD_DATA_IMPORT_PATH:}
    charset: ${FOOD_DATA_IMPORT_CHARSET:UTF-8}
ingredient-seed:
  enabled: false
