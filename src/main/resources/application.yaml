spring:
  application:
    name: CapstoneProject
  profiles:
    active: ${DATABASE_SOURCE:h2}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  config:
    import: optional:classpath:data/ingredients.yaml
  h2:
    console:
      enabled: true
      path: /h2-console  # (기본값이라 생략 가능하지만 명시적으로 적어주면 좋습니다)
  datasource:
    url: jdbc:h2:mem:capstone;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
fridge:
  expiry-disposal:
    # 매일 자정에 유통기한이 지난 보관 중 재료를 폐기 처리한다.
    cron: "0 0 0 * * *"
gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  timeout: ${GEMINI_TIMEOUT:30s}
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:${AWS_S3_REGION:ap-northeast-2}}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
food-data:
  import:
    enabled: ${FOOD_DATA_IMPORT_ENABLED:false}
    path: ${FOOD_DATA_IMPORT_PATH:}
    charset: ${FOOD_DATA_IMPORT_CHARSET:UTF-8}
ingredient-seed:
  enabled: true
recipe-data:
  import:
    enabled: ${RECIPE_DATA_IMPORT_ENABLED:true}
    path: ${RECIPE_DATA_IMPORT_PATH:classpath:data/한국농수산식품유통공사_학교급식전자조달시스템.csv}
    charset: ${RECIPE_DATA_IMPORT_CHARSET:CP949}
security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes-long}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
auth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
    success-redirect: ${GOOGLE_SUCCESS_REDIRECT:http://localhost:8081}
