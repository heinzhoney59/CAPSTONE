spring:
  application:
    name: CapstoneProject
  # 재료 마스터 초기 데이터를 별도 YAML에서 읽는다.
  config:
    import: classpath:data/ingredients.yaml
  datasource:
    # 현재는 로그인 구현 전 개발·테스트용 인메모리 DB를 사용한다.
    url: jdbc:h2:mem:capstone;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    # 지연 로딩 프록시가 서비스 밖에서 무분별하게 조회되지 않도록 비활성화한다.
    open-in-view: false
    hibernate:
      # 개발 단계에서는 엔티티 변경을 DB 스키마에 자동 반영한다.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
fridge:
  expiry-disposal:
    # 매일 자정에 유통기한이 지난 보관 중 재료를 폐기 처리한다.
    cron: "0 0 0 * * *"
